name: tests
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    concurrency:
      group: unit-${{ github.ref }}-${{ matrix.os }}-${{ matrix.go-version }}
      cancel-in-progress: true
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x]
        os: [windows]
    env:
      OS: ${{ matrix.os }}-latest
      GO: ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Test
        # Windows GHA notes:
        # - -race hangs with this project's deps
        # - -coverpkg=./internal/... pulls sshsession/termview (ConPTY) into every
        #   test binary and also hangs / stalls on Windows runners
        # Use per-package coverage, verbose output, and fail fast for diagnosis.
        run: go test -v -p 1 -failfast -vet=off -count=1 -timeout 2m -coverprofile unit.txt -covermode atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./unit.txt
          flags: unit,${{ matrix.os }},go-${{ matrix.go-version }}
          name: unit
          token: ${{ secrets.CODECOV_TOKEN }}
