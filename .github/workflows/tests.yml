name: tests
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    concurrency:
      group: unit-${{ github.ref }}-${{ matrix.os }}-${{ matrix.go-version }}
      cancel-in-progress: true
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x]
        os: [windows]
    env:
      OS: ${{ matrix.os }}-latest
      GO: ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Test (non-UI packages)
        # First prove the Windows runner is healthy without termview/ConPTY.
        # Package-by-package so the log shows exactly where it stops.
        shell: bash
        run: |
          set -o pipefail
          pkgs=$(go list ./internal/config ./internal/logger ./internal/model/... ./internal/state ./internal/storage/... ./internal/utils ./internal/version)
          echo "Packages:" 
          echo "$pkgs"
          failed=0
          for pkg in $pkgs; do
            echo "======== START $pkg ========"
            if ! go test -v -count=1 -timeout 45s -vet=off "$pkg" 2>&1 | tee -a test-output.txt; then
              echo "======== FAIL $pkg ========"
              failed=1
              break
            fi
            echo "======== OK $pkg ========"
          done
          exit $failed
      - name: Test (UI packages)
        if: success()
        shell: bash
        run: |
          set -o pipefail
          pkgs=$(go list ./internal/app ./internal/ui/... )
          echo "Packages:"
          echo "$pkgs"
          failed=0
          for pkg in $pkgs; do
            echo "======== START $pkg ========"
            if ! go test -v -count=1 -timeout 45s -vet=off "$pkg" 2>&1 | tee -a test-output.txt; then
              echo "======== FAIL $pkg ========"
              failed=1
              break
            fi
            echo "======== OK $pkg ========"
          done
          exit $failed
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output-${{ matrix.go-version }}
          path: test-output.txt
          if-no-files-found: warn
