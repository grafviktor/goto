
name: Bug Report
description: Report unexpected behaviour or a problem.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please provide enough information to reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the problem.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this behaviour?
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      validations:
        required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, goto version, installation method.
      placeholder: |
        OS: macOS / Linux
        Architecture: amd64 / arm64
        Version:
        Installation: Homebrew / binary / source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Attach relevant logs, screenshots or terminal output.
    validations:
      required: false
