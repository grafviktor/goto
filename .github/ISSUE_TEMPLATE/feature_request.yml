name: Feature Request
description: Suggest a new feature or improvement.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to goto!
        Please describe the problem you'd like to solve.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem are you trying to solve?
      placeholder: |
        I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like this feature to work.
      placeholder: |
        It would be useful if...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, examples, references or other information.
    validations:
      required: false
